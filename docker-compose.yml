services:
  db:
    image: mysql:8.0
    container_name: cinebook-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cinebook_root_pwd
      MYSQL_DATABASE: cinebook_db
      MYSQL_USER: cinebook_user
      MYSQL_PASSWORD: cinebook_user_pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: cinebook-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=cinebook-production-ultra-secret-key-2025
      - DATABASE_URL=mysql+pymysql://cinebook_user:cinebook_user_pwd@db:3306/cinebook_db
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_BASE_URL=https://api.themoviedb.org/3
      - TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
      - SEAT_LOCK_TIMEOUT_MINUTES=10
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  mysql_data:
