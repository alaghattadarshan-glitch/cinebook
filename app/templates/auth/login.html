{% extends "base.html" %}
{% block title %}Sign In | CINEBOOK{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-card);">
  <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff;">Sign In</h2>
  <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">Access your movie tickets and past bookings</p>

  <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <div style="margin-bottom: 1.25rem;">
      <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
      <input type="email" name="email" required placeholder="name@domain.com" style="width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 0.95rem;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Password</label>
      <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 0.95rem;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">Sign In</button>
  </form>

  <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
    Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-red); font-weight: 600;">Register here</a>
  </div>
</div>
{% endblock %}
