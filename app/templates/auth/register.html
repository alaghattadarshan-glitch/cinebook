{% extends "base.html" %}
{% block title %}Create an Account | CINEBOOK{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-card);">
  <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff;">Create Account</h2>
  <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">Join CINEBOOK to book seats in seconds</p>

  <form method="POST" action="{{ url_for('auth.register') }}">
    <div style="margin-bottom: 1.25rem;">
      <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Full Name</label>
      <input type="text" name="name" required placeholder="John Doe" style="width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
      <input type="email" name="email" required placeholder="john@example.com" style="width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Phone Number</label>
      <input type="tel" name="phone" placeholder="+91 98765 43210" style="width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Password (Min. 6 chars)</label>
      <input type="password" name="password" required minlength="6" placeholder="••••••••" style="width: 100%; padding: 0.65rem 0.9rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">Create Account</button>
  </form>

  <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
    Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-red); font-weight: 600;">Sign in here</a>
  </div>
</div>
{% endblock %}
