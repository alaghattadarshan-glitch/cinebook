<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout &amp; Payment | CINEBOOK</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <a th:href="@{/}">
        <img th:src="@{/images/logo.svg}" alt="CINEBOOK">
      </a>
    </div>
  </nav>

  <main class="main-content" style="max-width: 860px; margin: 2rem auto;">
    <h1 class="section-title" style="margin-bottom: 1.5rem;">Order Summary &amp; Payment</h1>

    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 2rem;">
      <!-- Payment Selection & Customer Info -->
      <div style="background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.75rem;">
        <h3 style="font-size: 1.15rem; color: #fff; margin-bottom: 1.25rem;">Contact &amp; Payment Method</h3>

        <form action="/book/process-payment" method="POST">
          <div style="margin-bottom: 1rem;">
            <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Customer Name</label>
            <input type="text" name="customerName" required value="Darshan Prabhu" style="width: 100%; padding: 0.6rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
            <div>
              <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Email Address</label>
              <input type="email" name="customerEmail" required value="darshan@example.com" style="width: 100%; padding: 0.6rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
            </div>
            <div>
              <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Mobile Phone</label>
              <input type="tel" name="customerPhone" required value="+91 9876543210" style="width: 100%; padding: 0.6rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
            </div>
          </div>

          <h4 style="font-size: 1rem; color: #fff; margin-bottom: 0.75rem;">Choose Simulated Payment Method</h4>
          <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.75rem; background: var(--bg-card); padding: 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); cursor: pointer;">
              <input type="radio" name="paymentMethod" value="UPI" checked onclick="document.getElementById('upi-box').style.display='block'; document.getElementById('card-box').style.display='none';">
              <div>
                <span style="font-weight: 700; color: #fff;">UPI (Google Pay, PhonePe, Paytm)</span>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Instant virtual payment address verification</p>
              </div>
            </label>

            <label style="display: flex; align-items: center; gap: 0.75rem; background: var(--bg-card); padding: 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); cursor: pointer;">
              <input type="radio" name="paymentMethod" value="CARD" onclick="document.getElementById('upi-box').style.display='none'; document.getElementById('card-box').style.display='block';">
              <div>
                <span style="font-weight: 700; color: #fff;">Debit / Credit Card</span>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Visa, Mastercard, RuPay processing</p>
              </div>
            </label>

            <label style="display: flex; align-items: center; gap: 0.75rem; background: var(--bg-card); padding: 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); cursor: pointer;">
              <input type="radio" name="paymentMethod" value="CASH" onclick="document.getElementById('upi-box').style.display='none'; document.getElementById('card-box').style.display='none';">
              <div>
                <span style="font-weight: 700; color: #fff;">Counter / Cash Payment</span>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Pay directly at Box Office terminal in Bengaluru</p>
              </div>
            </label>
          </div>

          <div id="upi-box" style="margin-bottom: 1.5rem;">
            <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">UPI ID</label>
            <input type="text" name="upiId" value="user@okaxis" style="width: 100%; padding: 0.6rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
          </div>

          <div id="card-box" style="display: none; margin-bottom: 1.5rem;">
            <label style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Card Number</label>
            <input type="text" name="cardNumber" value="4111 2222 3333 4444" style="width: 100%; padding: 0.6rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem;" th:text="'Pay ₹' + ${totalPrice} + ' & Complete Booking'">Pay</button>
        </form>
      </div>

      <!-- Ticket Breakdown Summary -->
      <div style="background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.75rem; height: fit-content;">
        <h3 style="font-size: 1.15rem; color: #fff; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Show Details</h3>
        <h4 style="font-size: 1.25rem; color: var(--accent-red); margin-bottom: 0.25rem;" th:text="${show.movie.title}">Movie Title</h4>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;" th:text="${show.movie.language} + ' &bull; ' + ${show.screen.screenType}">Language</p>

        <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.25rem; line-height: 1.6;">
          <p>📍 <strong th:text="${show.screen.theatre.name}">Cinema</strong></p>
          <p>🗓️ <span th:text="${#temporals.format(show.startTime, 'dd MMM yyyy, hh:mm a')}">Time</span></p>
        </div>

        <div style="border-top: 1px dashed var(--border-color); padding-top: 1rem;">
          <div style="display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 0.5rem;">
            <span>Seats (<span th:text="${seats.size()}">1</span>):</span>
            <span style="font-weight: 700; color: #fff;">
              <span th:each="s, stat : ${seats}" th:text="${s.seat.seatCode} + (${stat.last} ? '' : ', ')">A1</span>
            </span>
          </div>

          <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; color: #fff; margin-top: 1.25rem;">
            <span>Total Payable:</span>
            <span style="color: var(--accent-red);" th:text="'₹' + ${totalPrice}">₹250</span>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
