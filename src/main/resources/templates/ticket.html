<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="'Ticket Confirmed - ' + ${booking.bookingReference} + ' | CINEBOOK'">Digital Ticket | CINEBOOK</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/ticket.css}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <a th:href="@{/}">
        <img th:src="@{/images/logo.svg}" alt="CINEBOOK">
      </a>
      <span style="font-size: 0.75rem; background: #22c55e; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px;">BOOKED</span>
    </div>
    <div class="nav-actions">
      <a th:href="@{/}" class="btn btn-primary">Book Another Movie</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="ticket-wrapper">
      <div class="ticket-header">
        <div class="ticket-brand">
          <img th:src="@{/images/logo.svg}" alt="CINEBOOK" style="height: 32px;">
        </div>
        <span class="ticket-status-badge">● TICKET BOOKED &amp; CONFIRMED</span>
      </div>

      <div class="ticket-body">
        <div>
          <h2 class="ticket-movie-title" th:text="${booking.show.movie.title}">Movie Title</h2>
          <p style="color: var(--text-secondary); font-size: 0.9rem;" th:text="${booking.show.movie.genre} + ' &bull; ' + ${booking.show.movie.language} + ' &bull; ' + ${booking.show.movie.runtime} + ' mins'">Details</p>

          <div class="ticket-grid-details">
            <div class="ticket-field">
              <label>Cinema &amp; Location</label>
              <span th:text="${booking.show.screen.theatre.name}">Cinema Name</span>
              <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${booking.show.screen.theatre.location}">Location</div>
            </div>

            <div class="ticket-field">
              <label>Screen &amp; Sound</label>
              <span th:text="${booking.show.screen.screenNumber}">Screen 1</span>
              <div style="font-size: 0.75rem; color: var(--accent-gold);" th:text="${booking.show.screen.soundType}">Dolby Atmos</div>
            </div>

            <div class="ticket-field">
              <label>Show Date &amp; Time</label>
              <span th:text="${#temporals.format(booking.show.startTime, 'dd MMM yyyy, hh:mm a')}">Date</span>
            </div>

            <div class="ticket-field">
              <label>Reserved Seat(s)</label>
              <span style="color: var(--accent-gold); font-size: 1.25rem;" th:text="${booking.getSeatCodesFormatted()}">A1, A2</span>
            </div>

            <div class="ticket-field">
              <label>Booking Reference</label>
              <span th:text="${booking.bookingReference}">CNB-12345</span>
            </div>

            <div class="ticket-field">
              <label>Total Paid (INR)</label>
              <span style="color: var(--accent-red);" th:text="'₹' + ${booking.totalAmount} + ' (' + ${booking.paymentMethod} + ')'">₹250</span>
            </div>
          </div>
        </div>

        <!-- Scannable Verified QR Code -->
        <div class="ticket-qr-section">
          <img th:if="${booking.ticket != null and booking.ticket.qrBase64 != null}"
               th:src="${booking.ticket.qrBase64}"
               alt="Digital Gate QR Code"
               class="ticket-qr-img">
          <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Gate Entry Code</span>
          <span style="font-size: 0.85rem; font-weight: 700; color: #fff; margin-top: 0.25rem;" th:text="${booking.ticket != null ? booking.ticket.ticketNumber : 'TKT-VALID'}">TKT-123456</span>
        </div>
      </div>

      <div class="ticket-footer-actions">
        <button onclick="window.print()" class="btn btn-primary">🖨️ Print Ticket</button>
        <a th:href="@{/}" class="btn btn-secondary">Home Page</a>
      </div>
    </div>
  </main>

</body>
</html>
